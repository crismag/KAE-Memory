evidence:
  - id: EV-002
    source: SRC-001
    statement: >
      The repository contains a domain package, a persistence package with
      SQLAlchemy mappings and a CockroachDB retry policy, one Alembic revision,
      ten tests, a CI workflow, nine engineering specifications, three accepted
      ADRs, and eleven project documents.
    location: repository root
    type: current_behavior
    confidence: high
    supports:
      - CON-004
      - ADR-0002
      - ADR-0003
  - id: EV-003
    source: SRC-001
    statement: >
      Persistence covers knowledge items and knowledge versions only. Project,
      agent, session, message, and relationship tables do not exist, and no
      application service, interface, or user interface is implemented.
    location: src/kae_memory/, migrations/versions/
    type: current_behavior
    confidence: high
    supports:
      - OQ-010
  - id: EV-004
    source: SRC-001
    statement: >
      make check does not pass. ruff reports six findings, ruff format would
      reformat two files, and one persistence test fails because SQLite returns
      naive datetimes that violate the timezone-aware provenance invariant.
      Alembic has no alembic.ini or migrations/env.py, and no uv.lock is
      committed. mypy strict passes.
    location: repository root
    type: current_behavior
    confidence: high
    supports:
      - TASK-002
      - TASK-003
      - TASK-004
      - TASK-005

knowledge_gaps:
  - id: KG-001
    topic: Uncommitted project assets
    why_needed: >
      Previously described repository structure and supporting documentation were
      not visible in the public repository.
    category: source
