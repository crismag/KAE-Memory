model:
  version: 5
  last_commit: 5
  generated: "2026-07-27"

project:
  name: KAE-Memory
  working_title: Persistent Memory and Knowledge Evolution for Autonomous AI Agents
  description: >
    Engineering-memory operating system for an AI-native software engineering
    platform, demonstrated through an AI product-discovery workspace that turns
    an incomplete software idea into confirmed, source-traceable engineering
    knowledge and a development blueprint.
  status: implementation
  project_type: platform
  intended_users:
    - independent software developers
    - AI-assisted developers
    - engineering teams
    - solution architects
    - technical consultants
    - technical founders
  stakeholders:
    - human product and architecture owner
    - human developers
    - AI coding agents
    - internal platform agents
  target_platforms:
    - web application
    - Python library
  downstream_consumers:
    - human team
    - coding agents
    - internal platform agents
  existing_assets:
    - project vision and objectives
    - development-context methodology
    - requirements-engineering framework
    - agent role definitions
    - prompt packages
    - development workflow documentation
    - knowledge-acquisition methodology
    - public GitHub implementation repository
    - engineering specifications
    - domain contracts
    - CockroachDB persistence foundations
    - product experience definition
    - demonstration narrative
    - execution roadmap
  known_constraints:
    - CON-001
    - CON-002
    - CON-003
    - CON-004
  open_questions:
    - OQ-010
    - OQ-011
    - OQ-012
    - OQ-013
  depth: full
  current_stage: implementation_kickoff
  current_milestone: M4

milestones:
  - id: M0
    title: Foundation
    outcome: repository, tooling, CI, and layered context model
    status: complete
  - id: M1
    title: Domain
    outcome: identifiers, provenance, knowledge versions, lifecycle, typed errors
    status: complete
  - id: M2
    title: Persistence
    outcome: SQLAlchemy knowledge mapping, retry semantics, first migration
    status: complete
    note: >
      Knowledge items and versions only. Project, session, message, and
      relationship tables are not implemented.
  - id: M3
    title: Product Experience
    outcome: product identity, journey, screens, demo narrative, architecture context
    status: complete
  - id: M4
    title: Repository Realignment
    outcome: project documents describe the repository that actually exists
    status: current
  - id: M5
    title: Clickable Prototype
    outcome: seeded UI proving the discovery journey without backend dependencies
    status: open
  - id: M6
    title: Walking Skeleton
    outcome: >
      Application layer over the existing persistence foundation: project
      creation, persisted message, candidate knowledge, and the schema the
      remaining entities still require.
    status: open
  - id: M7
    title: Knowledge Lifecycle
    outcome: confirm, reject, revise, and supersede with audit history
    status: open
  - id: M8
    title: Semantic Retrieval
    outcome: embeddings, structured and semantic recall, return-session proof
    status: open
  - id: M9
    title: AWS Integration
    outcome: deployment of only the services the coherent product slice requires
    status: open
  - id: M10
    title: Demo Ready
    outcome: resettable environment, seed data, fallbacks, submission evidence
    status: open

requirements:
  - id: BG-001
    title: Persistent multi-agent software engineering
    statement: >
      Build a production-grade AI-native software engineering platform with
      persistent shared engineering memory.
    type: business
    source: user-interview
    priority: must
    status: captured
    confidence: high
  - id: UN-001
    title: Long-term AI engineering collaboration
    statement: >
      Developers need AI collaborators that retain project knowledge and maintain
      consistency across long-running software projects.
    type: user
    source: user-interview
    priority: must
    status: captured
    confidence: high
  - id: CON-001
    title: Specification boundary
    statement: >
      Product direction, requirements, architecture, and task definition precede
      implementation. Coding agents execute bounded tasks rather than inventing
      scope.
    type: constraint
    source: operating-principles
    priority: must
    status: validated
    confidence: high
  - id: CON-002
    title: Human-in-the-loop governance
    statement: >
      Human owners retain product vision, requirements validation, architecture
      approval, final technical decisions, and quality assurance.
    type: constraint
    source: user-interview
    priority: must
    status: captured
    confidence: high
  - id: CON-003
    title: Incremental implementation
    statement: >
      Implementation proceeds incrementally in vertical, independently verifiable
      product slices.
    type: constraint
    source: user-interview
    priority: must
    status: captured
    confidence: high
  - id: CON-004
    title: Implementation repository
    statement: >
      The public crismag/KAE-Memory repository is the implementation target for
      the persistent-memory foundation.
    type: constraint
    source: user-decision
    priority: must
    status: captured
    confidence: high
  - id: FR-001
    title: Project creation
    statement: >
      A user can create a durable project from an incomplete idea and return to it
      by stable identifier.
    type: functional
    source: product-experience
    priority: must
    status: approved
    confidence: high
  - id: FR-002
    title: Session continuity
    statement: >
      Work is grouped into sessions belonging to a project, and a later session
      resumes from durable project state rather than an empty conversation.
    type: functional
    source: product-experience
    priority: must
    status: approved
    confidence: high
  - id: FR-003
    title: Message and source capture
    statement: >
      Every user submission is persisted verbatim as source evidence before any
      interpretation occurs.
    type: functional
    source: product-experience
    priority: must
    status: approved
    confidence: high
  - id: FR-004
    title: Candidate knowledge extraction
    statement: >
      Submitted input produces typed candidate knowledge items with provenance
      linking each item to the source that produced it.
    type: functional
    source: product-experience
    priority: must
    status: approved
    confidence: medium
  - id: FR-005
    title: Human confirmation
    statement: >
      A human can confirm, reject, or revise candidate knowledge, and the item's
      status is visible in the interface.
    type: functional
    source: product-experience
    priority: must
    status: approved
    confidence: high
  - id: FR-006
    title: Supersession without loss
    statement: >
      Correcting knowledge marks the prior version superseded and keeps it
      retrievable rather than deleting it.
    type: functional
    source: product-experience
    priority: must
    status: approved
    confidence: high
  - id: FR-007
    title: Cross-session retrieval
    statement: >
      Confirmed project knowledge can be retrieved in a later session with its
      status, version, and source visible.
    type: functional
    source: product-experience
    priority: must
    status: approved
    confidence: high
  - id: FR-008
    title: Blueprint preview
    statement: >
      Confirmed knowledge can be rendered as a reviewable blueprint whose
      statements link back to their supporting evidence.
    type: functional
    source: product-experience
    priority: must
    status: approved
    confidence: medium

decisions:
  - id: ADR-0001
    title: Memory-first foundation
    statement: >
      Durable, provenance-aware knowledge is implemented before orchestration,
      retrieval, generation, or user interface work.
    status: accepted
    record: specifications/ADR/ADR-0001-memory-first.md
    affects:
      - MOD-knowledge
      - MOD-persistence
  - id: ADR-0002
    title: Python library-first bootstrap
    statement: >
      The system begins as a Python 3.12 library with transport- and
      persistence-independent domain contracts. Application and service layers are
      added only when a slice requires them.
    status: accepted
    record: specifications/ADR/ADR-0002-python-library-first-bootstrap.md
    affects:
      - MOD-knowledge
      - MOD-workflow
  - id: ADR-0003
    title: SQLAlchemy, Alembic, and psycopg persistence
    statement: >
      Persistence uses SQLAlchemy 2.0 mappings, Alembic migrations, and psycopg 3
      against CockroachDB, with serialization-failure retry at the unit-of-work
      boundary.
    status: accepted
    record: specifications/ADR/ADR-0003-sqlalchemy-alembic-psycopg.md
    affects:
      - MOD-persistence

