risks:
  - id: RISK-001
    description: >
      Beginning implementation before defining the project may cause invented
      scope and untraceable development tasks.
    category: delivery
    likelihood: low
    impact: high
    affects:
      - BG-001
    mitigation: >
      Requirements, architecture decisions, and bounded task contexts are now
      recorded and precede each slice.
    owner: human product and architecture owner
    status: mitigated
  - id: RISK-002
    description: >
      Multi-agent collaboration through persistent shared memory may create
      conflicting knowledge or degraded engineering quality.
    category: technical
    likelihood: medium
    impact: critical
    affects:
      - BG-001
      - UN-001
    mitigation: >
      Lifecycle states, supersession without deletion, and provenance on every
      version are implemented in the domain and must be preserved by every slice.
    owner: human product and architecture owner
    status: open
  - id: RISK-003
    description: >
      Premature repository bootstrapping could embed accidental architecture.
    category: delivery
    likelihood: low
    impact: medium
    affects:
      - CON-003
      - CON-004
    mitigation: >
      The bootstrap was constrained to a library-first core with ports at the
      persistence boundary, recorded in ADR-0002 and ADR-0003.
    owner: human product and architecture owner
    status: mitigated
  - id: RISK-004
    description: >
      Project documentation drifted ahead of and behind the implemented code,
      causing coding agents to act on an inaccurate repository state.
    category: delivery
    likelihood: high
    impact: high
    affects:
      - CON-001
      - CON-003
    mitigation: >
      docs/00_project/CURRENT_PROJECT_STATE.md is the first-loaded context and is
      updated at the close of every milestone.
    owner: human product and architecture owner
    status: mitigating
  - id: RISK-005
    description: >
      The main branch does not pass its own quality gate, so CI signal is
      unreliable and defects can accumulate unnoticed.
    category: quality
    likelihood: high
    impact: high
    affects:
      - CON-003
    mitigation: >
      RA-01 restored all four gates on 2026-07-27. main must stay green; a pull
      request that leaves make check failing is rejected rather than merged.
    owner: human product and architecture owner
    status: closed
  - id: RISK-006
    description: >
      Hackathon demonstration depends on cloud services that are not yet
      provisioned and on model behaviour that is not yet measured.
    category: delivery
    likelihood: medium
    impact: high
    affects:
      - BG-001
    mitigation: >
      Deterministic adapters, seeded demo state, and documented fallback outputs
      are required before the demo milestone.
    owner: human product and architecture owner
    status: open

open_questions:
  - id: OQ-006
    question: >
      What is the approved MVP-1 feature boundary and its Must-have requirements?
    status: closed
    resolution: >
      Closed by the approved MVP requirements baseline and MVP scope boundary:
      project, session, message, knowledge, confirmation, supersession,
      retrieval, and blueprint preview are in; multi-agent runtime, MCP write
      operations, advanced retrieval, and document ingestion are deferred.
  - id: OQ-007
    question: >
      What are the approved bounded contexts, module boundaries, and service
      contracts?
    status: closed
    resolution: >
      Closed by the module and interface sets recorded in this model: projects,
      sessions, knowledge, persistence, workflow, retrieval, blueprint, and audit,
      exposed through project, knowledge, retrieval, and blueprint services.
  - id: OQ-008
    question: >
      What is the persistent engineering-memory domain model and its ownership?
    status: closed
    resolution: >
      Closed by the implemented domain contracts and DOMAIN_MODEL specification.
      Physical design beyond the knowledge tables remains open under OQ-010.
  - id: OQ-009
    question: >
      Are the previously described repository structure and supporting documents
      stored elsewhere or not yet committed?
    status: closed
    resolution: >
      Closed by EV-002. The assets are committed and are the current source of
      truth.
  - id: OQ-010
    question: >
      What is the physical schema for projects, sessions, messages,
      relationships, and AgentRun, and how does it relate to the existing
      knowledge tables?
    status: closed
    resolution: >
      Closed by ADR-0005. Additive revision 0002 with six tables; revision 0001
      unchanged. References into the existing knowledge tables use STRING(64)
      because knowledge_items.id is STRING(64), not UUID. Project ownership of
      knowledge is enforced in the application layer until an optional revision
      0003 aligns the types.
  - id: OQ-011
    question: >
      Which frontend technology delivers the discovery workspace?
    status: closed
    resolution: >
      Closed by ADR-0009. React and TypeScript on Vite with React Router and
      TanStack Query, client-side rendered to static assets, no JavaScript server
      runtime. Four corrections: the package stays at src/ and the frontend goes
      in frontend/ rather than relocating to backend/; run status follows the
      domain enum with the client generated from OpenAPI early rather than
      hand-written; M9 sequences API contract before UI because no interface
      layer exists yet; and CI gains a Node job so frontend checks gate main.
  - id: OQ-013
    question: >
      What readiness model determines when a blueprint may be generated?
    why_it_matters: >
      Readiness is a visible product signal and a gate on the primary output; an
      invented formula would misrepresent project state to the user.
    blocks:
      - M9
    owner: human product and architecture owner
    risk_if_unanswered: medium
    default_if_unanswered: >
      Readiness is presented as coverage of required discovery areas only, with no
      numeric score treated as approved.
    status: open
  - id: OQ-014
    question: >
      Which embedding model, vector column type, and index strategy support
      semantic retrieval?
    status: closed
    resolution: >
      Closed by ADR-0008. amazon.titan-embed-text-v2:0 at 1024 normalised float
      dimensions, CockroachDB VECTOR(1024), cosine distance, one vector index on
      a shared knowledge_chunks table. Four corrections against the repository:
      knowledge_id is STRING(64) not UUID; identifiers and timestamps are
      application-generated; vector behaviour cannot run on SQLite so M8 tests
      split into portable and CockroachDB-gated; and Titan needs a separate
      EmbeddingPort with boto3, since the Anthropic Bedrock client cannot invoke
      an Amazon model.
  - id: OQ-016
    question: >
      Which AWS runtime hosts the application and worker, ECS Fargate or App
      Runner?
    why_it_matters: >
      The deployment must prove disposable compute with the least operational
      surface; the choice affects restart semantics and cost controls.
    blocks:
      - M10
    owner: human product and architecture owner
    risk_if_unanswered: high
    default_if_unanswered: >
      No AWS service is provisioned.
    status: open

assumptions:
  - classification: assumption
    statement: >
      CockroachDB remains the durable-memory foundation. The knowledge tables are
      approved; the remaining physical design is not.
    status: active
  - classification: assumption
    statement: >
      AWS is the intended deployment target, but no service is provisioned and no
      deployment baseline is approved.
    status: active

tasks:
  - id: TASK-001
    title: Define core domain contracts
    milestone: M1
    status: complete
    scope:
      - src/kae_memory/domain/
      - tests/domain/
    record: development/tasks/TASK-001-domain-contracts.md
  - id: TASK-002
    title: Repository realignment
    milestone: M4
    status: complete
    objective: >
      Update the project model, README, requirements baseline, scope, brief,
      development plan, execution roadmap, and context index so that repository
      documentation describes the implemented system, and add a first-loaded
      current-state page.
    scope:
      - README.md
      - project-model.yaml
      - docs/
    prohibited:
      - application code
      - schema changes
      - service provisioning
  - id: TASK-003
    title: Restore green quality gate
    milestone: M4
    status: complete
    objective: >
      Fix timezone normalisation on knowledge rehydration, clear the six ruff
      findings and two formatting differences, and make make check pass.
    scope:
      - src/kae_memory/
      - tests/
    acceptance:
      - make check passes locally and in CI
  - id: TASK-004
    title: Executable migration environment
    milestone: M4
    status: complete
    objective: >
      Add alembic.ini and migrations/env.py so revision 0001 can be applied and
      rolled back, and document the local database workflow.
    scope:
      - alembic.ini
      - migrations/
      - docs/09_development/
  - id: TASK-005
    title: Reproducible dependency resolution and retry tests
    milestone: M4
    status: complete
    objective: >
      Commit uv.lock and add tests covering run_transaction retry, backoff, and
      exhaustion behaviour including SQLSTATE 40001 detection.
    scope:
      - uv.lock
      - tests/persistence/
  - id: TASK-006
    title: Persistent memory proof
    milestone: M5
    status: complete
    record: development/tasks/TASK-006-m5-persistence.md
    objective: >
      Implement project, session, message, and AgentRun persistence additive to
      revision 0001, with memory write and structured retrieval through
      application contracts, and a test in which one agent writes and another
      retrieves in a separate run.
  - id: TASK-007
    title: Agent collaboration
    milestone: M6
    status: complete
    record: development/tasks/TASK-007-m6-agent-collaboration.md
    objective: >
      Implement the Requirements and Architecture agents, a deterministic
      extraction adapter behind a port, human confirmation, and context assembly
      that gives the Architecture Agent confirmed requirements only.
  - id: TASK-008
    title: Resilience and recovery
    milestone: M7
    status: complete
    record: development/tasks/TASK-008-m7-resilience-recovery.md
    note: >
      Decided by ADR-0007 and unblocked by M6. Requires additive revision 0003
      for the lease columns.
    objective: >
      Implement idempotency keys, bounded retry with backoff, durable run status
      with lease expiry and reclaim, failure simulation, and continuation from
      the last committed checkpoint.
  - id: TASK-009
    title: Semantic retrieval
    milestone: M8
    status: ready
    note: >
      Decided by ADR-0008. Needs a CockroachDB v25.4+ cluster: vector tests are
      skipped, never silently passed, when one is absent.
    objective: >
      Implement embeddings, vector columns and index, and semantic search
      combined with structured filters, scoped to one project, with result
      explanations.
  - id: TASK-010
    title: Workspace, Review Agent, and reporting
    milestone: M9
    status: blocked
    blocked_by:
      - TASK-008
      - OQ-013
    note: >
      Frontend decided by ADR-0009. Sequence within M9 is API contract, then
      generated client, then UI. CI gains a Node job when frontend code lands.
    objective: >
      Implement the discovery workspace over real API state, the Review Agent and
      its quality findings, and reporting generated from operational data.
  - id: TASK-011
    title: AWS demonstration deployment
    milestone: M10
    status: blocked
    blocked_by:
      - TASK-010
      - OQ-016
    objective: >
      Deploy application, worker, and CockroachDB Cloud with health endpoint,
      managed secrets, structured logs, reproducible deployment, and documented
      teardown.
  - id: TASK-012
    title: Demo readiness and release package
    milestone: M11
    status: blocked
    blocked_by:
      - TASK-011
    objective: >
      Deliver resettable demo environment, seed and cleanup commands, fallbacks,
      architecture diagram, deployment and local-development guides, security
      notes, known limitations, deck, video, Devpost narrative, and release tag.
  - id: TASK-013
    title: Planning amendment
    milestone: M4
    status: complete
    objective: >
      Remove the contradiction between the approved MVP baseline and the
      hackathon demonstration plan, and establish the authoritative
      implementation plan.
    scope:
      - docs/
      - specifications/
      - project-model.yaml
      - README.md
      - LICENSE
    prohibited:
      - application code
      - RA-01 remediation work

acceptance_tests:
  - id: AT-001
    status_note: passing as of M5
    covers:
      - FR-003
      - FR-004
    scenario: >
      A submitted message is persisted verbatim and produces at least one
      candidate knowledge item whose provenance identifies that message.
    status: defined
  - id: AT-002
    covers:
      - FR-005
      - FR-006
    scenario: >
      Confirming an item makes it active; revising it creates a new version and
      leaves the prior version retrievable as superseded.
    status: defined
  - id: AT-003
    status_note: passing as of M5
    covers:
      - FR-002
      - FR-007
    scenario: >
      A second session for the same project retrieves knowledge confirmed in the
      first session, with status, version, and source intact.
    status: defined
  - id: AT-004
    covers:
      - FR-008
    scenario: >
      A generated blueprint section links each statement to the confirmed
      knowledge item and source evidence that produced it.
    status: defined
  - id: AT-005
    status_note: passing as of M7
    covers:
      - FR-011
      - FR-012
    scenario: >
      A run terminated mid-execution is resumed by a different worker and
      completes, with no duplicated knowledge.
    status: defined
  - id: AT-006
    covers:
      - FR-009
      - FR-010
    scenario: >
      The Architecture Agent consumes requirements confirmed in an earlier
      session and cites them in its output.
    status: defined
  - id: AT-007
    status_note: passing as of M7
    covers:
      - FR-012
    scenario: >
      Replaying a submission with the same idempotency key produces one run and
      one set of knowledge.
    status: defined
  - id: AT-008
    covers:
      - FR-017
    scenario: >
      The deployed health endpoint reports healthy with the expected migration
      revision.
    status: defined
  - id: AT-009
    covers:
      - FR-016
      - FR-011
    scenario: >
      Terminating the worker task and letting the platform restart it results in
      the interrupted run resuming and completing, with no duplicated knowledge
      and no manual intervention.
    status: defined

