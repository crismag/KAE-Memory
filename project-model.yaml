      - migrations/
      - docs/09_development/
  - id: TASK-005
    title: Reproducible dependency resolution and retry tests
    milestone: M4
    status: ready
    objective: >
      Commit uv.lock and add tests covering run_transaction retry, backoff, and
      exhaustion behaviour including SQLSTATE 40001 detection.
    scope:
      - uv.lock
      - tests/persistence/
  - id: TASK-006
    title: UI prototype plan
    milestone: M5
    status: blocked
    blocked_by:
      - OQ-011
    objective: >
      Produce docs/09_development/plans/PX_01_UI_PROTOTYPE_PLAN.md defining
      routes, components, states, seeded demo data, and accessibility
      requirements. No implementation.
  - id: TASK-007
    title: Walking skeleton
    milestone: M6
    status: blocked
    blocked_by:
      - OQ-010
      - OQ-012
    objective: >
      Implement project creation, message submission, durable source capture, and
      deterministic candidate extraction behind ports, surfaced in the discovery
      workspace.
  - id: TASK-008
    title: Confirmation and supersession flow
    milestone: M7
    status: blocked
    blocked_by:
      - TASK-007
    objective: >
      Implement confirm, reject, revise, and supersede operations over the
      existing lifecycle contracts with audit history and dependent-output flags.

acceptance_tests:
  - id: AT-001
    covers:
      - FR-003
      - FR-004
    scenario: >
      A submitted message is persisted verbatim and produces at least one
      candidate knowledge item whose provenance identifies that message.
    status: defined
  - id: AT-002
    covers:
      - FR-005
      - FR-006
    scenario: >
      Confirming an item makes it active; revising it creates a new version and
      leaves the prior version retrievable as superseded.
    status: defined
  - id: AT-003
    covers:
      - FR-002
      - FR-007
    scenario: >
      A second session for the same project retrieves knowledge confirmed in the
      first session, with status, version, and source intact.
    status: defined
  - id: AT-004
    covers:
      - FR-008
    scenario: >
      A generated blueprint section links each statement to the confirmed
      knowledge item and source evidence that produced it.
    status: defined

