evidence:
  - id: EV-001
    source: SRC-001
    statement: >
      The public repository currently exposes one commit and a root .gitignore,
      with no visible application source, tests, schema, CI, or architecture
      package.
    location: repository root
    type: current_behavior
    confidence: high
    supports:
      - CON-004

knowledge_gaps:
  - id: KG-001
    topic: Uncommitted project assets
    why_needed: >
      Previously described repository structure and supporting documentation
      were not visible in the public repository.
    category: source
    current_understanding: >
      They may be local, private, or not yet committed.
    risk_if_wrong: medium
    blocks:
      - repository-state validation
    status: open

research_findings: []

risks:
  - id: RISK-001
    description: >
      Beginning implementation before defining the project may cause invented
      scope and untraceable development tasks.
    category: delivery
    likelihood: high
    impact: high
    affects:
      - BG-001
    mitigation: >
      Approve requirements, architecture, and bounded tasks before implementation.
    owner: human product and architecture owner
    status: open
  - id: RISK-002
    description: >
      Multi-agent collaboration through persistent shared memory may create
      conflicting knowledge or degraded engineering quality.
    category: technical
    likelihood: medium
    impact: critical
    affects:
      - BG-001
      - UN-001
    mitigation: >
      Make the first release test persistent collaboration, provenance,
      conflict handling, and reuse across sessions.
    owner: human product and architecture owner
    status: open
  - id: RISK-003
    description: >
      Premature repository bootstrapping could embed accidental architecture.
    category: delivery
    likelihood: high
    impact: high
    affects:
      - CON-003
      - CON-004
    mitigation: >
      Bootstrap context and planning files first; defer implementation-specific
      structure until the MVP and architecture are approved.
    owner: human product and architecture owner
    status: open

open_questions:
  - id: OQ-006
    question: >
      What is the approved MVP-1 feature boundary and its Must-have requirements?
    why_it_matters: >
      Architecture and implementation tasks must trace to an approved release
      boundary.
    blocks:
      - requirements baseline
      - architecture
      - development tasks
    owner: human product and architecture owner
    risk_if_unanswered: critical
    default_if_unanswered: >
      Only capabilities directly required to prove persistent multi-agent
      engineering memory are considered candidate MVP scope.
    status: open
  - id: OQ-007
    question: >
      What are the approved bounded contexts, module boundaries, and service
      contracts?
    why_it_matters: >
      Repository layout and task scope depend on stable ownership boundaries.
    blocks:
      - executable architecture
      - implementation tasks
    owner: human product and architecture owner
    risk_if_unanswered: high
    default_if_unanswered: >
      No service decomposition or framework-specific repository structure is
      approved.
    status: open
  - id: OQ-008
    question: >
      What is the persistent engineering-memory domain model and its ownership?
    why_it_matters: >
      Memory is the central product capability and shapes data, retrieval,
      provenance, versioning, and conflict behaviour.
    blocks:
      - data architecture
      - CockroachDB schema
      - memory contracts
    owner: human product and architecture owner
    risk_if_unanswered: critical
    default_if_unanswered: >
      No physical database schema may be treated as approved.
    status: open
  - id: OQ-009
    question: >
      Are the previously described repository structure and supporting documents
      stored elsewhere or not yet committed?
    why_it_matters: >
      Existing assets may constrain or replace parts of this bootstrap package.
    blocks:
      - complete source inventory
    owner: human product and architecture owner
    risk_if_unanswered: medium
    default_if_unanswered: >
      Treat the public repository as greenfield.
    status: open

assumptions:
  - classification: assumption
    statement: >
      CockroachDB remains the preferred durable-memory foundation, but no
      physical schema or integration architecture is approved.
    status: active

