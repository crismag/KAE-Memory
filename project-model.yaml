model:
  version: 6
  last_commit: 6
  generated: "2026-07-27"

project:
  name: KAE-Memory
  working_title: Persistent Memory and Knowledge Evolution for Autonomous AI Agents
  description: >
    Engineering-memory operating system for an AI-native software engineering
    platform, demonstrated through an AI product-discovery workspace that turns
    an incomplete software idea into confirmed, source-traceable engineering
    knowledge and a development blueprint.
  status: implementation
  project_type: platform
  intended_users:
    - independent software developers
    - AI-assisted developers
    - engineering teams
    - solution architects
    - technical consultants
    - technical founders
  stakeholders:
    - human product and architecture owner
    - human developers
    - AI coding agents
    - internal platform agents
  target_platforms:
    - web application
    - Python library
  downstream_consumers:
    - human team
    - coding agents
    - internal platform agents
  existing_assets:
    - project vision and objectives
    - development-context methodology
    - requirements-engineering framework
    - agent role definitions
    - prompt packages
    - development workflow documentation
    - knowledge-acquisition methodology
    - public GitHub implementation repository
    - engineering specifications
    - domain contracts
    - CockroachDB persistence foundations
    - product experience definition
    - demonstration narrative
    - execution roadmap
  known_constraints:
    - CON-001
    - CON-002
    - CON-003
    - CON-004
  open_questions:
    - OQ-013
    - OQ-016
  depth: full
  current_stage: implementation_kickoff
  current_milestone: M8

milestones:
  - id: M0
    title: Foundation
    outcome: repository, tooling, CI, and layered context model
    status: complete
  - id: M1
    title: Domain
    outcome: identifiers, provenance, knowledge versions, lifecycle, typed errors
    status: complete
  - id: M2
    title: Persistence
    outcome: SQLAlchemy knowledge mapping, retry semantics, first migration
    status: complete
    note: >
      Knowledge items and versions. Extended by M5 with projects, sessions,
      messages, agent runs, relationships, and provenance links.
  - id: M3
    title: Product Experience
    outcome: product identity, journey, screens, demo narrative, architecture context
    status: complete
  - id: M4
    title: Repository Realignment
    outcome: project documents describe the repository that actually exists
    status: complete
  - id: M5
    title: Persistent Memory Proof
    outcome: >
      Project, session, message, and AgentRun persistence with memory write and
      structured retrieval through application contracts. Agent A writes, Agent B
      retrieves in a separate run.
    status: complete
  - id: M6
    title: Agent Collaboration
    outcome: >
      Requirements and Architecture agents, human confirmation, and context
      assembly that gives the Architecture Agent confirmed requirements only.
    status: complete
  - id: M7
    title: Resilience and Recovery
    outcome: >
      Idempotency, bounded retry, durable run status, lease reclaim, and
      continuation after worker termination.
    status: complete
  - id: M8
    title: Semantic Retrieval
    outcome: one embedding model, one index, semantic recall with explanations
    status: current
  - id: M9
    title: Workspace and Reporting
    outcome: >
      Discovery workspace over real state, Review Agent findings, and reporting
      generated from operational data.
    status: open
  - id: M10
    title: AWS Demonstration
    outcome: deployed chain, disposable compute, health endpoint, managed secrets
    status: open
  - id: M11
    title: Demo Ready and Release
    outcome: rehearsal, packaging, judging assets, release tag
    status: open

requirements:
  - id: BG-001
    title: Persistent multi-agent software engineering
    statement: >
      Build a production-grade AI-native software engineering platform with
      persistent shared engineering memory.
    type: business
    source: user-interview
    priority: must
    status: captured
    confidence: high
  - id: UN-001
    title: Long-term AI engineering collaboration
    statement: >
      Developers need AI collaborators that retain project knowledge and maintain
      consistency across long-running software projects.
    type: user
    source: user-interview
    priority: must
    status: captured
    confidence: high
  - id: CON-001
    title: Specification boundary
    statement: >
      Product direction, requirements, architecture, and task definition precede
      implementation. Coding agents execute bounded tasks rather than inventing
      scope.
    type: constraint
    source: operating-principles
    priority: must
    status: validated
    confidence: high
  - id: CON-002
    title: Human-in-the-loop governance
    statement: >
      Human owners retain product vision, requirements validation, architecture
      approval, final technical decisions, and quality assurance.
    type: constraint
    source: user-interview
    priority: must
    status: captured
    confidence: high
  - id: CON-003
    title: Incremental implementation
    statement: >
      Implementation proceeds incrementally in vertical, independently verifiable
      product slices.
    type: constraint
    source: user-interview
    priority: must
    status: captured
    confidence: high
  - id: CON-004
    title: Implementation repository
    statement: >
      The public crismag/KAE-Memory repository is the implementation target for
      the persistent-memory foundation.
    type: constraint
    source: user-decision
    priority: must
    status: captured
    confidence: high
  - id: FR-001
    title: Project creation
    statement: >
      A user can create a durable project from an incomplete idea and return to it
      by stable identifier.
    type: functional
    source: product-experience
    priority: must
    status: approved
    confidence: high
  - id: FR-002
    title: Session continuity
    statement: >
      Work is grouped into sessions belonging to a project, and a later session
      resumes from durable project state rather than an empty conversation.
    type: functional
    source: product-experience
    priority: must
    status: approved
    confidence: high
  - id: FR-003
    title: Message and source capture
    statement: >
      Every user submission is persisted verbatim as source evidence before any
      interpretation occurs.
    type: functional
    source: product-experience
    priority: must
    status: approved
    confidence: high
  - id: FR-004
    title: Candidate knowledge extraction
    statement: >
      Submitted input produces typed candidate knowledge items with provenance
      linking each item to the source that produced it.
    type: functional
    source: product-experience
    priority: must
    status: approved
    confidence: medium
  - id: FR-005
    title: Human confirmation
    statement: >
      A human can confirm, reject, or revise candidate knowledge, and the item's
      status is visible in the interface.
    type: functional
    source: product-experience
    priority: must
    status: approved
    confidence: high
  - id: FR-006
    title: Supersession without loss
    statement: >
      Correcting knowledge marks the prior version superseded and keeps it
      retrievable rather than deleting it.
    type: functional
    source: product-experience
    priority: must
    status: approved
    confidence: high
  - id: FR-007
    title: Cross-session retrieval
    statement: >
      Confirmed project knowledge can be retrieved in a later session with its
      status, version, and source visible.
    type: functional
    source: product-experience
    priority: must
    status: approved
    confidence: high
  - id: FR-008
    title: Blueprint preview
    statement: >
      Confirmed knowledge can be rendered as a reviewable blueprint whose
      statements link back to their supporting evidence.
    type: functional
    source: product-experience
    priority: must
    status: approved
    confidence: medium
  - id: FR-009
    title: Bounded multi-agent execution
    statement: >
      Exactly three predefined agent roles are authorised: Requirements,
      Architecture, and Review, each with declared read scope, write scope, and
      prohibitions. No agent confirms knowledge.
    type: functional
    source: hackathon-plan
    priority: must
    status: approved
    confidence: high
  - id: FR-010
    title: Persistent AgentRun records
    statement: >
      Every agent execution is durably recorded before work begins; knowledge
      writes and the accompanying run status change commit in one transaction.
    type: functional
    source: hackathon-plan
    priority: must
    status: approved
    confidence: high
  - id: FR-011
    title: Durable workflow continuation
    statement: >
      An interrupted run is resumable by a different worker from its last
      committed checkpoint, using only durable state.
    type: functional
    source: hackathon-plan
    priority: must
    status: approved
    confidence: high
  - id: FR-012
    title: Idempotency, retry, and failure
    statement: >
      Run submission is idempotent by key; retry is bounded with backoff;
      exhaustion moves a run to abandoned and raises a visible finding.
    type: functional
    source: hackathon-plan
    priority: must
    status: approved
    confidence: high
  - id: FR-013
    title: Semantic retrieval
    statement: >
      Structured filters plus semantic similarity over project knowledge and
      evidence, single-project scope, one approved embedding model and index,
      with an explanation of why each result was included.
    type: functional
    source: hackathon-plan
    priority: must
    status: approved
    confidence: medium
  - id: FR-014
    title: CockroachDB MCP inspection
    statement: >
      MCP is available for schema inspection, query plans, cluster health,
      documentation, and read-only audit. All domain writes go through KAE
      application contracts.
    type: functional
    source: hackathon-plan
    priority: must
    status: approved
    confidence: high
  - id: FR-015
    title: Review and quality reporting
    statement: >
      The Review Agent produces quality findings, and reporting is generated from
      the same operational data the workspace shows.
    type: functional
    source: hackathon-plan
    priority: must
    status: approved
    confidence: medium
  - id: FR-016
    title: Demonstration deployment
    statement: >
      Application, one worker, and CockroachDB Cloud deployed to AWS such that
      the application is reachable, compute is disposable, and an interrupted run
      resumes after a worker restart.
    type: functional
    source: hackathon-plan
    priority: must
    status: approved
    confidence: medium
  - id: FR-017
    title: Health and observability
    statement: >
      An unauthenticated GET /health reports status, database connectivity,
      migration revision, and version; logs are structured and carry run
      identifiers.
    type: functional
    source: hackathon-plan
    priority: must
    status: approved
    confidence: high
  - id: FR-018
    title: Secrets management
    statement: >
      Credentials come from environment locally and from AWS secret storage when
      deployed. No credential appears in the repository, an image, a log, a
      document, or an agent transcript.
    type: constraint
    source: hackathon-plan
    priority: must
    status: approved
    confidence: high

decisions:
  - id: ADR-0001
    title: Memory-first foundation
    statement: >
      Durable, provenance-aware knowledge is implemented before orchestration,
      retrieval, generation, or user interface work.
    status: accepted
    record: specifications/ADR/ADR-0001-memory-first.md
    affects:
      - MOD-knowledge
      - MOD-persistence
  - id: ADR-0002
    title: Python library-first bootstrap
    statement: >
      The system begins as a Python 3.12 library with transport- and
      persistence-independent domain contracts. Application and service layers are
      added only when a slice requires them.
    status: accepted
    record: specifications/ADR/ADR-0002-python-library-first-bootstrap.md
    affects:
      - MOD-knowledge
      - MOD-workflow
  - id: ADR-0003
    title: SQLAlchemy, Alembic, and psycopg persistence
    statement: >
      Persistence uses SQLAlchemy 2.0 mappings, Alembic migrations, and psycopg 3
      against CockroachDB, with serialization-failure retry at the unit-of-work
      boundary.
    status: accepted
    record: specifications/ADR/ADR-0003-sqlalchemy-alembic-psycopg.md
    affects:
      - MOD-persistence
  - id: ADR-0004
    title: CockroachDB MCP is inspection-only
    statement: >
      MCP is used for inspection and management only. All domain writes go
      through KAE application contracts; agents never hold raw database
      credentials.
    status: accepted
    record: specifications/ADR/ADR-0004-mcp-inspection-only.md
    affects:
      - MOD-workflow
      - MOD-persistence
      - MOD-audit
  - id: ADR-0005
    title: Physical schema for the M5 persistent-memory proof
    statement: >
      Additive revision 0002 creates projects, sessions, agent_runs, messages,
      knowledge_relationships, and knowledge_provenance_links. Revision 0001 is
      unchanged. Application-generated UUID keys, TIMESTAMPTZ, JSONB only for
      open-ended state, no cascading deletion, no database enums, no vector
      columns.
    status: accepted
    record: specifications/ADR/ADR-0005-m5-physical-schema.md
    closes: OQ-010
    affects:
      - MOD-projects
      - MOD-sessions
      - MOD-persistence
      - MOD-workflow
  - id: ADR-0006
    title: Extraction provider, prompt contract, and output schema
    statement: >
      Claude on Amazon Bedrock behind an ExtractionPort, with structured JSON
      outputs, versioned per-role prompts, source-quote verification before any
      write, and determinism from a fixture adapter rather than sampling
      parameters, which the current models reject.
    status: accepted
    record: specifications/ADR/ADR-0006-extraction-contract.md
    closes: OQ-012
    affects:
      - MOD-workflow
      - MOD-knowledge
  - id: ADR-0007
    title: Durable worker runtime and renewable run leases
    statement: >
      A dedicated long-running worker process separate from the API, claiming
      runs through short atomic CockroachDB transactions with a monotonically
      increasing fencing token, a 30-second renewable lease, and durable
      checkpoints after every step. CockroachDB is the authoritative owner of
      runnable work, ownership, expiry, retry state, and checkpoints. The
      guarantee is at-least-once step execution; exactly-once is not claimed.
    status: accepted
    record: specifications/ADR/ADR-0007-worker-runtime-and-leases.md
    closes: OQ-015
    affects:
      - MOD-workflow
      - MOD-persistence
  - id: ADR-0008
    title: Semantic embedding model and CockroachDB vector index
    statement: >
      Amazon Titan Text Embeddings V2 through Bedrock at 1024 normalised float
      dimensions, stored as CockroachDB VECTOR(1024) with cosine distance and a
      single vector index on a shared knowledge-chunk table. Embedding runs
      asynchronously through the durable worker and never blocks authoritative
      persistence. Vector behaviour is CockroachDB-only and cannot be verified on
      the portable SQLite test path.
    status: accepted
    record: specifications/ADR/ADR-0008-embedding-model-and-vector-index.md
    closes: OQ-014
    affects:
      - MOD-retrieval
      - MOD-persistence
      - MOD-workflow
  - id: ADR-0009
    title: Discovery workspace frontend technology
    statement: >
      React and TypeScript on Vite, React Router in declarative or data mode,
      TanStack Query for server state, client-side rendering to static assets.
      No JavaScript server runtime. The frontend is a presentation client; the
      Python API stays authoritative and the browser never owns a run. The
      frontend lives in frontend/ alongside src/, its API types are generated
      from OpenAPI rather than hand-written, and its checks gate main.
    status: accepted
    record: specifications/ADR/ADR-0009-discovery-workspace-frontend.md
    closes: OQ-011
    affects:
      - MOD-blueprint
      - MOD-audit
      - IF-project
      - IF-knowledge
      - IF-retrieval
  - id: ADR-0010
    title: Provider-neutral extraction and BYOK product direction
    statement: >
      ExtractionPort stays the application boundary and Bedrock remains the only
      approved live adapter for the demonstration. Provider-neutral extraction
      and bring-your-own-key are approved as post-demo product direction, with
      usage governance required before any operator-funded public inference.
      Credentials are references, never durable project memory. Amends ADR-0006
      section 9 and its deferral of cross-provider abstraction.
    status: accepted
    record: specifications/ADR/ADR-0010-provider-neutral-extraction-and-byok-direction.md
    amends: ADR-0006
    affects:
      - MOD-workflow
  - id: ADR-0011
    title: Tests run against CockroachDB, not SQLite
    statement: >
      The suite runs against a single-node CockroachDB at the production major
      version, locally and in CI. SQLite is removed entirely after producing two
      false passes and being unable to express VECTOR at all. Adds the
      sqlalchemy-cockroachdb dialect and the cockroachdb+psycopg URL scheme.
      Amends ADR-0003 and withdraws ADR-0008's portable-versus-gated test split.
    status: accepted
    record: specifications/ADR/ADR-0011-test-against-cockroachdb.md
    amends: ADR-0003, ADR-0008
    affects:
      - MOD-persistence
      - MOD-retrieval

