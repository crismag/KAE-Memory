research_findings: []

risks:
  - id: RISK-001
    description: >
      Beginning implementation before defining the project may cause invented
      scope and untraceable development tasks.
    category: delivery
    likelihood: low
    impact: high
    affects:
      - BG-001
    mitigation: >
      Requirements, architecture decisions, and bounded task contexts are now
      recorded and precede each slice.
    owner: human product and architecture owner
    status: mitigated
  - id: RISK-002
    description: >
      Multi-agent collaboration through persistent shared memory may create
      conflicting knowledge or degraded engineering quality.
    category: technical
    likelihood: medium
    impact: critical
    affects:
      - BG-001
      - UN-001
    mitigation: >
      Lifecycle states, supersession without deletion, and provenance on every
      version are implemented in the domain and must be preserved by every slice.
    owner: human product and architecture owner
    status: open
  - id: RISK-003
    description: >
      Premature repository bootstrapping could embed accidental architecture.
    category: delivery
    likelihood: low
    impact: medium
    affects:
      - CON-003
      - CON-004
    mitigation: >
      The bootstrap was constrained to a library-first core with ports at the
      persistence boundary, recorded in ADR-0002 and ADR-0003.
    owner: human product and architecture owner
    status: mitigated
  - id: RISK-004
    description: >
      Project documentation drifted ahead of and behind the implemented code,
      causing coding agents to act on an inaccurate repository state.
    category: delivery
    likelihood: high
    impact: high
    affects:
      - CON-001
      - CON-003
    mitigation: >
      docs/00_project/CURRENT_PROJECT_STATE.md is the first-loaded context and is
      updated at the close of every milestone.
    owner: human product and architecture owner
    status: mitigating
  - id: RISK-005
    description: >
      The main branch does not pass its own quality gate, so CI signal is
      unreliable and defects can accumulate unnoticed.
    category: quality
    likelihood: high
    impact: high
    affects:
      - CON-003
    mitigation: >
      TASK-002 through TASK-005 restore a green make check before slice work
      begins.
    owner: human product and architecture owner
    status: open
  - id: RISK-006
    description: >
      Hackathon demonstration depends on cloud services that are not yet
      provisioned and on model behaviour that is not yet measured.
    category: delivery
    likelihood: medium
    impact: high
    affects:
      - BG-001
    mitigation: >
      Deterministic adapters, seeded demo state, and documented fallback outputs
      are required before the demo milestone.
    owner: human product and architecture owner
    status: open

open_questions:
  - id: OQ-006
    question: >
      What is the approved MVP-1 feature boundary and its Must-have requirements?
    status: closed
    resolution: >
      Closed by the approved MVP requirements baseline and MVP scope boundary:
      project, session, message, knowledge, confirmation, supersession,
      retrieval, and blueprint preview are in; multi-agent runtime, MCP write
      operations, advanced retrieval, and document ingestion are deferred.
  - id: OQ-007
    question: >
      What are the approved bounded contexts, module boundaries, and service
      contracts?
    status: closed
    resolution: >
      Closed by the module and interface sets recorded in this model: projects,
      sessions, knowledge, persistence, workflow, retrieval, blueprint, and audit,
      exposed through project, knowledge, retrieval, and blueprint services.
  - id: OQ-008
    question: >
      What is the persistent engineering-memory domain model and its ownership?
    status: closed
    resolution: >
      Closed by the implemented domain contracts and DOMAIN_MODEL specification.
      Physical design beyond the knowledge tables remains open under OQ-010.
  - id: OQ-009
    question: >
      Are the previously described repository structure and supporting documents
      stored elsewhere or not yet committed?
    status: closed
    resolution: >
      Closed by EV-002. The assets are committed and are the current source of
      truth.
  - id: OQ-010
    question: >
      What is the physical schema for projects, sessions, messages, and
      relationships, and how does it relate to the existing knowledge tables?
    why_it_matters: >
      The walking skeleton depends on tables that do not yet exist, and the
      existing knowledge migration must remain valid.
    blocks:
      - M6
      - M7
    owner: human product and architecture owner
    risk_if_unanswered: high
    default_if_unanswered: >
      No schema beyond the knowledge tables is treated as approved.
    status: open
  - id: OQ-011
    question: >
      Which frontend technology delivers the clickable prototype and the MVP
      workspace?
    why_it_matters: >
      M5 cannot begin implementation without an approved frontend decision and a
      recorded ADR.
    blocks:
      - M5
    owner: human product and architecture owner
    risk_if_unanswered: high
    default_if_unanswered: >
      No frontend framework is approved and no UI code may be committed.
    status: open
  - id: OQ-012
    question: >
      What model provider, prompt contract, and validation schema govern candidate
      knowledge extraction?
    why_it_matters: >
      Extraction determines knowledge quality, confirmation effort, and the
      deterministic test fixtures required for reproducible slices.
    blocks:
      - M6
      - M7
    owner: human product and architecture owner
    risk_if_unanswered: critical
    default_if_unanswered: >
      Only a deterministic fake extraction adapter may be used.
    status: open
  - id: OQ-013
    question: >
      What readiness model determines when a blueprint may be generated?
    why_it_matters: >
      Readiness is a visible product signal and a gate on the primary output; an
      invented formula would misrepresent project state to the user.
    blocks:
      - M10
    owner: human product and architecture owner
    risk_if_unanswered: medium
    default_if_unanswered: >
      Readiness is presented as coverage of required discovery areas only, with no
      numeric score treated as approved.
    status: open

assumptions:
  - classification: assumption
    statement: >
      CockroachDB remains the durable-memory foundation. The knowledge tables are
      approved; the remaining physical design is not.
    status: active
  - classification: assumption
    statement: >
      AWS is the intended deployment target, but no service is provisioned and no
      deployment baseline is approved.
    status: active

