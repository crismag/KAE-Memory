project:
  name: KAE-Memory
  working_title: Persistent Memory and Knowledge Evolution for Autonomous AI Agents
  description: >
    Persistent-memory foundation for an AI-native software engineering platform
    in which specialised AI agents collaborate across the software development
    lifecycle using durable shared project knowledge.
  status: requirements
  project_type: platform
  intended_users:
    - independent software developers
    - AI-assisted developers
    - engineering teams
    - solution architects
    - technical consultants
    - technical founders
  stakeholders:
    - human product and architecture owner
    - human developers
    - AI coding agents
    - internal platform agents
  target_platforms: []
  downstream_consumers:
    - human team
    - coding agents
    - internal platform agents
  existing_assets:
    - project vision and objectives
    - development-context methodology
    - requirements-engineering framework
    - agent role definitions
    - prompt packages
    - development workflow documentation
    - knowledge-acquisition methodology
    - public greenfield GitHub repository
  known_constraints:
    - CON-001
    - CON-002
    - CON-003
    - CON-004
  open_questions:
    - OQ-006
    - OQ-007
    - OQ-008
    - OQ-009
  depth: full
  current_stage: 3

requirements:
  - id: BG-001
    title: Persistent multi-agent software engineering
    statement: >
      Build a production-grade AI-native software engineering platform with
      persistent shared engineering memory.
    type: business
    source: user-interview
    priority: must
    status: captured
    confidence: high
  - id: UN-001
    title: Long-term AI engineering collaboration
    statement: >
      Developers need AI collaborators that retain project knowledge and maintain
      consistency across long-running software projects.
    type: user
    source: user-interview
    priority: must
    status: captured
    confidence: high
  - id: CON-001
    title: Specification boundary
    statement: >
      The context-architecture engagement produces requirements, design, tasks,
      and development context rather than the full production codebase.
    type: constraint
    source: operating-principles
    priority: must
    status: validated
    confidence: high
  - id: CON-002
    title: Human-in-the-loop governance
    statement: >
      Human owners retain product vision, requirements validation, architecture
      approval, final technical decisions, and quality assurance.
    type: constraint
    source: user-interview
    priority: must
    status: captured
    confidence: high
  - id: CON-003
    title: Incremental implementation
    statement: >
      Implementation proceeds incrementally from the existing planning and
      architecture foundation.
    type: constraint
    source: user-interview
    priority: must
    status: captured
    confidence: high
  - id: CON-004
    title: Implementation repository
    statement: >
      The public crismag/KAE-Memory repository is the implementation target for
      the persistent-memory foundation.
    type: constraint
    source: user-decision
    priority: must
    status: captured
    confidence: high

