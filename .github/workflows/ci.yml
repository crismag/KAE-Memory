name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install project
        run: uv sync --extra dev
      - name: Start PostgreSQL with pgvector
        # Tests run against an engine the product deploys on, never SQLite
        # (ADR-0011). PostgreSQL and CockroachDB are both supported (ADR-0022);
        # this job runs the one whose setup needs no credentials.
        run: |
          docker run -d --name kae-pg-test -p 5432:5432 \
            -e POSTGRES_USER=kae -e POSTGRES_PASSWORD=kae -e POSTGRES_DB=kae_memory_test \
            pgvector/pgvector:pg16
          for i in $(seq 1 60); do
            if docker exec kae-pg-test pg_isready -U kae >/dev/null 2>&1; then
              echo "PostgreSQL ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL did not become ready"; docker logs kae-pg-test; exit 1
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        # Provider-independent tests, the shared contract, PostgreSQL-specific
        # behaviour, and migrations. CockroachDB tests marked for it skip with a
        # reason rather than failing — see the cockroachdb-live job below.
        env:
          KAE_TEST_DATABASE_PROVIDER: postgresql
          KAE_TEST_DATABASE_URL: postgresql+psycopg://kae:kae@localhost:5432/kae_memory_test
        run: uv run pytest

  cockroachdb-live:
    # CockroachDB is a supported provider, not a deleted one. Its live
    # integration runs when a cluster is configured, and its absence must not
    # fail the pipeline: a suite that cannot run without every provider present
    # would make adding a third impossible.
    runs-on: ubuntu-latest
    if: vars.KAE_COCKROACHDB_CI_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install project
        run: uv sync --extra dev
      - name: Start CockroachDB
        run: |
          docker run -d --name kae-crdb-test -p 26258:26257 \
            cockroachdb/cockroach:v26.2.1 \
            start-single-node --insecure --store=type=mem,size=1GiB
          for i in $(seq 1 60); do
            if docker exec kae-crdb-test ./cockroach sql --insecure -e "SELECT 1" >/dev/null 2>&1; then
              docker exec kae-crdb-test ./cockroach sql --insecure \
                -e "CREATE DATABASE IF NOT EXISTS kae_memory_test"
              echo "CockroachDB ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "CockroachDB did not become ready"; docker logs kae-crdb-test; exit 1
      - name: Test
        env:
          KAE_TEST_DATABASE_PROVIDER: cockroachdb
          KAE_TEST_DATABASE_URL: cockroachdb+psycopg://root@localhost:26258/kae_memory_test?sslmode=disable
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the API, for schema generation
        run: uv sync --extra api
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Check the generated client is current
        # The client is generated from the OpenAPI document the API serves
        # (ADR-0009). Regenerating here and diffing catches a backend contract
        # change that was not carried into the checked-in schema.
        run: |
          uv run python scripts/development/dump-openapi.py
          npm --prefix frontend run generate-client
          git diff --exit-code frontend/openapi.json frontend/src/api/schema.ts
      - name: Typecheck
        run: npm run lint
        working-directory: frontend
      - name: Test
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
