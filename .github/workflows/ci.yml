name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install project
        run: uv sync --extra dev
      - name: Start CockroachDB
        # Tests run against the engine used in production, never SQLite
        # (ADR-0011). A service container cannot pass the start-single-node
        # arguments the image needs, so it is started explicitly.
        run: |
          docker run -d --name kae-crdb-test -p 26258:26257 \
            cockroachdb/cockroach:v26.2.1 \
            start-single-node --insecure --store=type=mem,size=1GiB
          for i in $(seq 1 60); do
            if docker exec kae-crdb-test ./cockroach sql --insecure -e "SELECT 1" >/dev/null 2>&1; then
              echo "CockroachDB ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "CockroachDB did not become ready"; docker logs kae-crdb-test; exit 1
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the API, for schema generation
        run: uv sync --extra api
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Check the generated client is current
        # The client is generated from the OpenAPI document the API serves
        # (ADR-0009). Regenerating here and diffing catches a backend contract
        # change that was not carried into the checked-in schema.
        run: |
          uv run python scripts/development/dump-openapi.py
          npm --prefix frontend run generate-client
          git diff --exit-code frontend/openapi.json frontend/src/api/schema.ts
      - name: Typecheck
        run: npm run lint
        working-directory: frontend
      - name: Test
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
