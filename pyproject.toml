[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kae-memory"
version = "0.1.0"
description = "Persistent memory and knowledge evolution for autonomous AI agents"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Cris Magalang" }]
dependencies = [
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
bedrock = [
  "anthropic[bedrock]>=0.100",
]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kae_memory"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=kae_memory --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# The provider SDK is an optional extra, imported lazily so the suite and a
# fixture-only demonstration run without it.
module = "anthropic.*"
ignore_missing_imports = true