[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kae-memory"
version = "0.1.0"
description = "Persistent memory and knowledge evolution for autonomous AI agents"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Cris Magalang" }]
dependencies = [
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "sqlalchemy-cockroachdb>=2.0",
]

[project.scripts]
kae-memory-mcp = "kae_memory.mcp.__main__:main"

[project.optional-dependencies]
bedrock = [
  "anthropic[bedrock]>=0.100",
  # Titan is an Amazon model: the Anthropic Bedrock client cannot invoke it.
  "boto3>=1.35",
]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
api = [
    "fastapi>=0.140.12",
    "uvicorn>=0.51.0",
]
mcp = [
    "mcp>=1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kae_memory"]

[tool.pytest.ini_options]
# `-m "not cockroachdb"` deselects the provider-parity suite by default.
#
# CockroachDB support is deferred by decision (F-003 / VG-4), and the standing
# rule is that no phase expands into provider parity. Running those tests needs
# a live Cockroach node, which costs more memory than the work it protects is
# worth on a development machine.
#
# Deselected, not deleted: `KAE_TEST_PROVIDER=cockroachdb pytest -m cockroachdb`
# still runs them when the decision is revisited. The offline adapter tests —
# type mapping, vector column spec — are not marked and keep running, so the
# parity *contract* stays covered without a server.
addopts = "--strict-markers --strict-config -m 'not cockroachdb' --cov=kae_memory --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "database: requires a live database",
    "database_contract: shared persistence contract test",
    "postgresql: requires the PostgreSQL provider",
    "cockroachdb: requires the CockroachDB provider",
    "migration: exercises Alembic migrations",
    # N47. `real_commits` opts out of rollback isolation for the few tests whose
    # subject is a write being visible across connections — a unique index
    # firing under concurrency, or a worker reading in its own session. Rollback
    # cannot serve them, and truncation should not be everyone else's default.
    "real_commits: needs writes visible across connections, not rolled back",
    "slow: expensive enough to exclude from the developer loop",
    "provider: calls or simulates an external provider",
    "synthesis_gate: qualitative golden-corpus assertions that fail until domain synthesizers exist",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Docstrings here are prose, and an en dash in "N30-N32" or a spaced clause is
# deliberate typography rather than a confusable-character mistake. RUF002 is
# aimed at homoglyphs in identifiers; applied to prose it only ever asks for the
# writing to be made worse.
ignore = ["RUF002"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Provider SDKs are optional extras, imported lazily so the suite and a
# fixture-only demonstration run without them.
module = ["anthropic.*", "boto3.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.9.1",
]
